version: '3.8'

services:
  # =====================================
  # Back-end API (Issuer)
  # =====================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: credo-api
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3000:3000" # Issuer Agent
    environment:
      - PORT=3000
      # Canonical root wallet identity (must remain stable across restarts/deploys).
      - WALLET_ID=${WALLET_ID:-shared-controller-agent}
      - WALLET_KEY=${WALLET_KEY:-shared-controller-key}
      - JWT_SECRET=development-jwt-secret-456
      - LOG_LEVEL=debug
      - PUBLIC_BASE_URL=http://172.19.0.10:3000
      - WALLET_URL=http://localhost:4000
      - PERSISTENCE_DB_PATH=/app/data/persistence.db
      - ASKAR_STORAGE_PATH=/home/credo/.afj
      # Fail fast if ssi_users tenant mappings don't exist in runtime tenant store.
      # Keep this false in docker demos to avoid startup regressions after container rebuilds.
      - ALLOW_TENANT_RECOVERY_ON_LOGIN=true
      - STRICT_TENANT_INVARIANT=false
      # Only run Issuer
      - HOLDER_API_PORT=7000
      # EcoCash Payment Mode: 'true' = simulated (auto-webhook), 'false' = live (USSD PIN push)
      - ECOCASH_SANDBOX=true
      - ECOCASH_WEBHOOK_SECRET=test-webhook-secret
      # Event-Based Offer Push Config (Docker Internal Network)
      # Disabled for manual acceptance flow (MVP Fastlane)
      # - OFFER_PUSH_URL=http://172.19.0.11:7000/api/wallet/holder-wallet/exchange/useOfferRequest
      # - OFFER_PUSH_API_KEY=holder-api-key-12345 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "./samples/startServer.js"]
    volumes:
      - ./data:/app/data
      - ./data/askar-issuer:/home/credo/.afj
    networks:
      credo-net:
        ipv4_address: 172.19.0.10
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 10s
      retries: 5

  # =====================================
  # HR Portal UI
  # =====================================
  portal:
    build:
      context: ./credo-ui/portal
      dockerfile: Dockerfile
    container_name: credo-portal
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Client-side (browser) URLs - must use localhost or public URLs
      - NEXT_PUBLIC_VC_REPO=http://localhost:3000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000
      - NEXT_PUBLIC_HOLDER_URL=http://localhost:3000
      - NEXT_PUBLIC_WALLET_URL=http://localhost:3000
      # Single API key for the unified credo-api backend
      - NEXT_PUBLIC_CREDO_API_KEY=test-api-key-12345
      - NEXT_PUBLIC_HOLDER_API_KEY=test-api-key-12345
      # Server-side (SSR/API routes) URLs - use Docker bridge IPs
      - BACKEND_URL=http://172.19.0.10:3000
      - VC_REPO_INTERNAL=http://172.19.0.10:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      credo-net:
        ipv4_address: 172.19.0.13

networks:
  credo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

# Using host bind mount for ./data to share persistence between services
