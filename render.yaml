# LDK iFacilities on Render (SGK jobs edition).
# Replacing the API service discards its /data disk; see docs/SECRETS_ROTATION.md.
# The phone app is not here. It ships as an APK pointed at these two addresses.
# Sign in as kelvin.mupungu@ldkgroup.co.uk before applying this file.
# Render has no Johannesburg region; Frankfurt is the closest.
# The API disk attaches to one instance, so the API stays at one instance.

services:
  - type: web
    name: ldk-ifacilities-api
    runtime: docker
    repo: https://github.com/elohwine/credo-controller
    branch: sgk-jobs
    region: frankfurt
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./deploy/render/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: sgk-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://ldk-ifacilities-api.onrender.com
      - key: PORTAL_UI_URL
        value: https://ldk-ifacilities-portal.onrender.com
      - key: PERSISTENCE_DB_PATH
        value: /data/persistence.db
      - key: TENANT_DB_PATH
        value: /data/tenants.db
      - key: OIDC_DB_PATH
        value: /data/oidc.db
      - key: ASKAR_STORAGE_PATH
        value: /data/askar
      - key: CONFIG_DATA_DIR
        value: /data
      - key: WALLET_ID
        value: sgk-controller-agent
      - key: WALLET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_HASH_PEPPER
        generateValue: true
      - key: PIN_SALT
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_DELIVERY_ENABLED
        value: "false"
      # Invite emails go through the shared LDK Resend account; only mail.ldkgroup.co.uk is verified there.
      - key: EMAIL_FROM
        value: LDK iFacilities <no-reply@mail.ldkgroup.co.uk>
      - key: RESEND_API_KEY
        sync: false
      # The phone app is not hosted yet, so invite links open the portal's join page.
      - key: INVITE_JOIN_URL
        value: https://ldk-ifacilities-portal.onrender.com/auth/join

  - type: web
    name: ldk-ifacilities-portal
    runtime: docker
    repo: https://github.com/elohwine/credo-controller
    branch: sgk-jobs
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./deploy/render/Dockerfile.portal
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_VC_REPO
        value: https://ldk-ifacilities-api.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://ldk-ifacilities-api.onrender.com
      - key: NEXT_PUBLIC_ISSUER_API_BASE
        value: https://ldk-ifacilities-api.onrender.com/oidc/issuer
      - key: NEXT_PUBLIC_VERIFIER_API_BASE
        value: https://ldk-ifacilities-api.onrender.com/oidc/verifier
      - key: NEXT_PUBLIC_CREDO_API_KEY
        value: test-api-key-12345
