name: Continuous Integration

on:
  pull_request:
    branches: [main, develop, platform-remodel]
  push:
    branches: [main, develop, platform-remodel]

concurrency:
  group: credo-controller-${{ github.ref }}-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    name: Validate
    steps:
      - name: Checkout credo-controller
        uses: actions/checkout@v4

      - name: Setup node v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Linting
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          yarn lint > lint.log 2>&1
          status=$?
          cat lint.log
          echo "$status" > lint.exit
          cat lint.log >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            lint.log
            lint.exit
          if-no-files-found: error

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Prettier
        run: yarn check-format

      - name: Compile
        run: yarn check-types
