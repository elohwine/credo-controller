# One Fly app for the Credo API and the SSI-to-OIDC bridge.
# Caddy on :8080 splits the public hostname. Hydra admin, Postgres and Redis stay on loopback.
# Do not add a second app for the bridge, and do not set min_machines_running = 0.
app = "credentis"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PUBLIC_BASE_URL = "https://credentis.fly.dev"
  HYDRA_PUBLIC_URL = "https://credentis.fly.dev/"
  VCLOGIN_PUBLIC_URL = "https://credentis.fly.dev"
  PARTNER_OIDC_ISSUER_URL = "https://credentis.fly.dev/"
  CREDENTIS_API_URL = "http://127.0.0.1:3000"
  HYDRA_ADMIN_URL = "http://127.0.0.1:4445"
  ASKAR_STORAGE_PATH = "/data/askar"
  PERSISTENCE_DB_PATH = "/data/persistence.db"
  TENANT_DB_PATH = "/data/tenants.db"
  OIDC_DB_PATH = "/data/oidc.db"
  CREDO_LISTEN_PORT = "3000"
  # WhatsApp notifications (non-secret). Tokens/app secret are Fly secrets.
  WABA_PHONE_NUMBER_ID = "1232138763320433"
  WABA_BUSINESS_ACCOUNT_ID = "1376175484008383"
  WHATSAPP_GRAPH_VERSION = "v26.0"
  WALLET_PUBLIC_URL = "https://credentis.fly.dev"
  MOBILE_APP_URL = "https://credentis.fly.dev/app"
  WHATSAPP_DELIVERY_ENABLED = "true"
  # Test-only until WHATSAPP_PRODUCTION_ENABLED = "true" is deliberately set.
  WHATSAPP_TEST_RECIPIENTS = "263774183277"
  ANDROID_APP_PACKAGE = "com.credentis.mobile"
  ANDROID_APP_CERT_SHA256 = "9F:D9:DB:FF:DE:69:92:A9:2B:6C:67:BF:92:C8:7D:7C:50:72:F1:88:02:57:25:AF:6D:1F:C7:0D:96:65:9D:E0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-4x"
  memory = "1024mb"

[[mounts]]
  source = "credentis_data"
  destination = "/data"
  initial_size = "1gb"
